<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj GitHub Web</title>
    <style>
        /* Základní reset a nastavení pozadí */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Tmavý elegantní gradient */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Kontejner pro obsah s animací */
        .container {
            text-align: center;
            opacity: 0; /* Začíná jako neviditelný pro animaci */
            animation: fadeInFloat 1.5s ease-out forwards;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            color: #d1d5db;
            margin-bottom: 40px;
        }

        /* Stylování tlačítka (odkazu) */
        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            color: #fff;
            text-decoration: none;
            border: 2px solid #fff;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: white;
            color: #0f2027;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        /* Samotná animace */
        @keyframes fadeInFloat {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ahoj, světe!</h1>
        <p>Vítej v mém koutku internetu. Pamatuj, že všechna světla v počítačových hrách svítí na elektřinu.</p>
        <a href="markdown-viewer.html" class="btn">Zobrazit můj Markdown</a>
    </div>
</body>
</html>
