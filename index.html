<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj první web na GitHub Pages</title>
    <style>
        /* Tady začíná CSS pro hezčí vzhled */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 50px;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #0056b3;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 20px;
        }
        .btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ahoj světe! 🚀</h1>
        <p>Tohle je můj úplně první web hostovaný přes <strong>GitHub Pages</strong>. Jsem nadšený/á z toho, jak to funguje!</p>
        
        <img src="https://picsum.photos/500/300" alt="Náhodný hezký obrázek">

        <br>

        <button class="btn" onclick="pozdrav()">Klikni na mě</button>
    </div>

    <script>
        /* Tady je kousek JavaScriptu pro interaktivitu */
        function pozdrav() {
            alert("Gratuluji! Tvůj první web úspěšně funguje a dokonce umí i JavaScript! 🎉");
        }
    </script>

</body>
</html>
