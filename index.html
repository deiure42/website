<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj GitHub Web</title>
    <style>
        /* Základní reset a nastavení pozadí */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Tmavý elegantní gradient */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Kontejner pro obsah s animací */
        .container {
            text-align: center;
            opacity: 0; /* Začíná jako neviditelný pro animaci */
            animation: fadeInFloat 1s ease-out forwards;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        /* Odkazy jako bloky pro články */
        .article-links { display: flex; gap: 20px; justify-content: center; }
        .btn {
            padding: 12px 25px; font-size: 1rem; color: #fff;
            text-decoration: none; border: 2px solid #fff; border-radius: 8px;
            transition: all 0.3s ease; background: rgba(255,255,255,0.1);
        }
        .btn:hover { background-color: white; color: #0f2027; transform: translateY(-3px); }
        
        @keyframes fadeInFloat {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Moje Znalostní Báze</h1>
        <p>Zápisky z Obsidianu přímo na webu.</p>
        
        <div class="article-links">
            <a href="markdown-viewer.html?file=sandbox" class="btn">Článek 1 (Test)</a>
            <a href="markdown-viewer.html?file=Simpson's paradox" class="btn">Článek 2 (Matematika)</a>
        </div>
    </div>
</body>
</html>
