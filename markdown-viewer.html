<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje zápisky</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f9f9f9;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #2c5364;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link:hover { text-decoration: underline; }
        
        /* Box pro samotný obsah markdownu */
        #content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-link">&larr; Zpět na úvod</a>
    
    <div id="content">
        <em>Načítám obsah...</em>
    </div>

    <script>
        // "Otevření a přečtení souboru" v JavaScriptu
        fetch('obsah.md')
            .then(response => {
                if (!response.ok) throw new Error("Soubor nebyl nalezen");
                return response.text();
            })
            .then(text => {
                // Přeložíme markdown text na HTML a vložíme do divu
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(error => {
                document.getElementById('content').innerHTML = '<p style="color: red;">Chyba: Nepodařilo se načíst Markdown soubor. Ujisti se, že soubor "obsah.md" existuje.</p>';
            });
    </script>
</body>
</html>
